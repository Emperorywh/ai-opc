# Manifest 只声明项目级策略，避免与 TASK 文档形成两套任务事实源。
# 任务依赖、写入边界与验收门禁统一由 tasks 目录中的前置元数据维护。
version: 2
project:
  root: .
  spec: SPEC.md
  plan: PLAN.md
  contextFiles:
    - AGENTS.md

defaults:
  maxAttempts: 3
  taskTimeoutMinutes: 45
  maxTurns: 80
  model: sonnet
  effort: high

review:
  enabled: true
  maxAttempts: 2
  model: sonnet
  effort: high
  maxTurns: 30

git:
  commitMessagePrefix: task

taskCatalog:
  directory: tasks

verification:
  sharedPaths:
    - node_modules
