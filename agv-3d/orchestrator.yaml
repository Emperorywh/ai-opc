# Manifest 只声明项目级策略，避免与 TASK 文档形成两套任务事实源。
# 任务依赖、写入边界与验收门禁统一由 tasks 目录中的前置元数据维护。
version: 2
project:
  root: .
  spec: SPEC.md
  plan: PLAN.md
  contextFiles:
    - AGENTS.md

defaults:
  # 新系统让实现、续跑和修复持续到任务收敛，只接受外部显式中断。
  # 不设置会把同一业务任务切碎并最终终止的尝试、时长或轮数硬上限。
  model: sonnet
  effort: high

review:
  enabled: true
  # 审核与实现采用相同的持续收敛策略，避免复杂候选因固定审核轮数被误判为终态失败。
  # Reviewer 仍保持只读边界，是否通过继续由结构化审核结果决定。
  model: sonnet
  effort: high

git:
  commitMessagePrefix: task

taskCatalog:
  directory: tasks

verification:
  sharedPaths:
    - node_modules
